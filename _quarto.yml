project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    # Repo documentation, not site pages. Without these exclusions Quarto renders
    # them into stray HTML pages and lists them in sitemap.xml.
    - "!README.md"
    - "!LICENSE-CONTENT.md"
    - "!TODO.md"
  resources:
    # Referenced only from styles.css, so Quarto can't discover it on its own.
    - icons/ORCID-iD_icon_BW_vector.svg

website:
  title: "Luca Sclisizzo"
  description: "Academic homepage of Luca Sclisizzo — research, contact, and software."
  # Must match Netlify's *primary* domain, or the sitemap and RSS feed will be
  # full of URLs that redirect. On this site the apex is primary and www
  # redirects to it — the reverse of the previous Hugo site.
  site-url: "https://lsclisizzo.com"
  # Link preview cards on Bluesky, LinkedIn, Slack, Mastodon etc. Both need
  # site-url set above — without it the image path can't be made absolute, and
  # scrapers ignore relative ones.
  open-graph: true
  favicon: icons/favicon.png
  twitter-card:
    # "summary" is the small square card, which suits a square headshot.
    # summary_large_image needs a wide ~1200x630 image; feeding it a square one
    # gets it centre-cropped, which lops the top and bottom off a face.
    card-style: summary
  image: files/profile.jpg
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: publications.qmd
        text: Publications
      - href: talks.qmd
        text: Talks & Conferences
      - href: unpublished.qmd
        text: Unpublished
      - href: software.qmd
        text: Software
      - href: about.qmd
        text: About
      - href: cv.qmd
        text: CV
    right:
      - icon: envelope
        href: mailto:luca.sclisizzo@gmail.com
        aria-label: Email
  page-footer:
    left: "© 2026 Luca Sclisizzo"
    right: "Built with [Quarto](https://quarto.org) | Template by [D.S. Quintana](https://dsquintana.com)"
  reader-mode: false

format:
  html:
    theme:
      dark: [darkly, theme-dark.scss]
      light: [cosmo, theme-light.scss]
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      body-width: 900px

execute:
  freeze: auto
