<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Luca Sclisizzo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #12151a; /* default: dark, come il resto del sito */
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #ffffff;
      }
    }
  </style>
  <script>
    try {
      let mode = null;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const val = localStorage.getItem(key);
        if (val === "light" || val === "dark") {
          mode = val;
          break;
        }
      }
      if (mode === "light") {
        document.documentElement.style.backgroundColor = "#ffffff";
      } else if (mode === "dark") {
        document.documentElement.style.backgroundColor = "#12151a";
      }
    } catch (e) {}
    location.replace("site_pages/index.html");
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=site_pages/index.html">
  </noscript>
  <link rel="canonical" href="https://lsclisizzo.com/site_pages/index.html">
</head>
<body></body>
</html>
